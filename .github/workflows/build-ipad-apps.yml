name: Build Complete 13-App iPadOS .ipa Suite

on:
  push:
    branches: [ main ]
    paths:
      - 'ios-wrapper/**'
      - 'scripts/generate_feather_source.py'
      - '.github/workflows/build-ipad-apps.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build ${{ matrix.app_name }} (.ipa)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: photocraft,  app_name: PhotoCraft,  bundle_id: com.craftsuite.photocraft }
          - { id: vectorcraft, app_name: VectorCraft, bundle_id: com.craftsuite.vectorcraft }
          - { id: designcraft, app_name: DesignCraft, bundle_id: com.craftsuite.designcraft }
          - { id: lightcraft,  app_name: LightCraft,  bundle_id: com.craftsuite.lightcraft }
          - { id: filmcraft,   app_name: FilmCraft,   bundle_id: com.craftsuite.filmcraft }
          - { id: effectcraft, app_name: EffectCraft, bundle_id: com.craftsuite.effectcraft }
          - { id: figcraft,    app_name: FigCraft,    bundle_id: com.craftsuite.figcraft }
          - { id: wordcraft,   app_name: WordCraft,   bundle_id: com.craftsuite.wordcraft }
          - { id: gridcraft,   app_name: GridCraft,   bundle_id: com.craftsuite.gridcraft }
          - { id: deckcraft,   app_name: DeckCraft,   bundle_id: com.craftsuite.deckcraft }
          - { id: pdfcraft,    app_name: PdfCraft,    bundle_id: com.craftsuite.pdfcraft }
          - { id: soundcraft,  app_name: SoundCraft,  bundle_id: com.craftsuite.soundcraft }
          - { id: cadcraft,    app_name: CADCraft,    bundle_id: com.craftsuite.cadcraft }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch WebAssembly Bundle (storytold/${{ matrix.id }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf ios-wrapper/www
          mkdir -p ios-wrapper/www

          REPO="storytold/${{ matrix.id }}"
          ASSET_NAME=$(gh release view --repo "$REPO" --json assets --jq '.assets[].name' | grep -iE 'web.*\.zip$' | head -n 1)
          echo "Downloading $ASSET_NAME from $REPO..."
          APP_VERSION=$(printf "%s" "$ASSET_NAME" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -n 1)
          test -n "$APP_VERSION" || { echo "::error::Cannot determine app version from $ASSET_NAME"; exit 1; }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Upstream app version: $APP_VERSION"
          gh release download --repo "$REPO" --pattern "$ASSET_NAME" --dir /tmp/web-release
          mkdir -p /tmp/web-extracted
          unzip -q "/tmp/web-release/$ASSET_NAME" -d /tmp/web-extracted
          INDEX_FILE=$(find /tmp/web-extracted -name "index.html" | head -n 1)
          BUNDLE_DIR=$(dirname "$INDEX_FILE")
          cp -R "$BUNDLE_DIR"/. ios-wrapper/www/

          if [ -d "ios-wrapper/www/app" ] && [ -d "ios-wrapper/www/snippets" ]; then
            cp -R ios-wrapper/www/snippets ios-wrapper/www/app/snippets
          fi
          rm -f ios-wrapper/www/.htaccess

      - name: Format Official 1024x1024 App Icon for ${{ matrix.app_name }}
        run: |
          ICON_SET="ios-wrapper/Sources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_SET"
          curl -LsSf "https://raw.githubusercontent.com/storytold/${{ matrix.id }}/main/assets/app-icon/${{ matrix.id }}-1024.png" -o /tmp/raw-icon.png

          pip3 install --quiet --break-system-packages Pillow
          python3 - << 'PYEOF'
          from PIL import Image
          img = Image.open("/tmp/raw-icon.png").convert("RGBA")
          w, h = img.size
          px = img.load()
          min_x, min_y, max_x, max_y = w, h, 0, 0
          for y in range(0, h, 2):
              for x in range(0, w, 2):
                  if px[x, y][3] > 200:
                      if x < min_x: min_x = x
                      if y < min_y: min_y = y
                      if x > max_x: max_x = x
                      if y > max_y: max_y = y
          if max_x <= min_x or max_y <= min_y:
              min_x, min_y, max_x, max_y = 0, 0, w - 1, h - 1
          sample = px[w // 2, min(h - 1, min_y + 25)]
          bg_rgb = (sample[0], sample[1], sample[2]) if sample[3] > 200 else (30, 41, 59)
          cropped = img.crop((min_x, min_y, max_x + 1, max_y + 1)).resize((1024, 1024), Image.Resampling.LANCZOS)
          bg = Image.new("RGBA", (1024, 1024), (*bg_rgb, 255))
          bg.alpha_composite(cropped)
          bg.convert("RGB").save("ios-wrapper/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png", "PNG")
          PYEOF

          cat > "$ICON_SET/Contents.json" << 'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Build Unsigned iPadOS .ipa with Xcode
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          cd ios-wrapper
          xcodegen generate

          xcodebuild -project CraftiPadApp.xcodeproj \
            -scheme CraftiPadApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            APP_NAME="${{ matrix.app_name }}" \
            APP_DISPLAY_NAME="${{ matrix.app_name }}" \
            APP_BUNDLE_ID="${{ matrix.bundle_id }}" \
            APP_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${{ matrix.app_name }}.app" Payload/
          zip -r -y "$GITHUB_WORKSPACE/${{ matrix.app_name }}-v${APP_VERSION}-iPad.ipa" Payload

      - name: Upload versioned ${{ matrix.app_name }} IPA to GitHub Release v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.2.0 >/dev/null 2>&1; then
            gh release create v1.2.0 --title "ArtCraft Suite for iPadOS (Updated 13 Apps)" --notes "Updated 13-app iPadOS IPA suite using latest available storytold web release bundles at build time." || true
          fi
          FILE="${{ matrix.app_name }}-v${APP_VERSION}-iPad.ipa"
          if gh release view v1.2.0 --json assets --jq '.assets[].name' | grep -Fxq "$FILE"; then
            echo "Preserving existing release asset: $FILE"
          else
            gh release upload v1.2.0 "$FILE"
          fi

      - name: Upload ${{ matrix.app_name }}-iPad.ipa Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_name }}-v${{ env.APP_VERSION }}-iPad-IPA
          path: ${{ matrix.app_name }}-v${{ env.APP_VERSION }}-iPad.ipa
          retention-days: 30

  cleanup-legacy-assets:
    name: Remove duplicate unversioned assets from v1.2.0
    needs: build-ipa
    if: ${{ needs.build-ipa.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove old unversioned IPAs only when versioned replacements exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for app in PhotoCraft VectorCraft DesignCraft LightCraft FilmCraft EffectCraft FigCraft WordCraft GridCraft DeckCraft PdfCraft SoundCraft CADCraft; do
            old="${app}-iPad.ipa"
            assets=$(gh release view v1.2.0 --json assets --jq '.assets[].name')
            if ! printf '%s\n' "$assets" | grep -Fxq "$old"; then
              echo "No legacy asset for $app"
              continue
            fi
            if ! printf '%s\n' "$assets" | grep -Eq "^${app}-v[0-9]+\\.[0-9]+\\.[0-9]+-iPad\\.ipa$"; then
              echo "::error::No versioned replacement for $old; preserving it."
              exit 1
            fi
            echo "Removing duplicate $old (versioned replacement is present)"
            gh release delete-asset v1.2.0 "$old" --yes
          done

  publish-feather-source:
    name: Refresh Feather source from all GitHub releases
    needs: [build-ipa, cleanup-legacy-assets]
    if: ${{ always() && needs.build-ipa.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Feather-compatible source JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/generate_feather_source.py
          python3 -m json.tool feather-source.json > /dev/null
          test "$(python3 -c 'import json; print(len(json.load(open("feather-source.json"))["apps"]))')" -eq 13
      - name: Publish source at permanent raw GitHub URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/contents/feather-source.json" --jq '.sha')
          content=$(base64 -w0 feather-source.json)
          gh api -X PUT "repos/$GH_REPO/contents/feather-source.json" \
            -f message="Update Feather source with available IPA releases" \
            -f content="$content" \
            -f sha="$sha" > /dev/null
          echo "Source: https://raw.githubusercontent.com/$GH_REPO/main/feather-source.json"
